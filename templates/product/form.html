{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel = "stylesheet" href = "{% static 'css/product.css' %}">
{% endblock %}
{% block content %}
<section class = "product-page">
    <h1>{{ title }}</h1>
    <form method = "post" enctype="multipart/form-data" class = "product-form" hx-boost = "true">
        {% csrf_token %}
        {{ form.as_p }}
        <button type = "submit" class = "button">Simpan</button>
    </form>
</section>
{% endblock %}
