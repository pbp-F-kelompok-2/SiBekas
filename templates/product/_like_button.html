<form class="product-like-form{% if variant == 'detail' %} product-like-form--detail{% endif %}" method="post" action="{% url 'product:toggle_like' product.slug %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit"
            class="{% if variant == 'detail' %}btn btn--outline btn--lg like-button{% else %}like-pill{% endif %}{% if product.is_liked %} is-liked{% endif %}"
            aria-pressed="{% if product.is_liked %}true{% else %}false{% endif %}"
            aria-label="Sukai {{ product.name }}">
        <i data-lucide="heart" aria-hidden="true"></i>
        <span class="like-count">{{ product.like_count }}</span>
    </button>
</form>
