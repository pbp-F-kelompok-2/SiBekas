<section class="auth-intro flex min-w-0 min-h-screen flex-col items-start justify-between gap-8 overflow-hidden px-[6.5%] py-[54px] max-[1000px]:px-[5%] max-[1000px]:py-10 max-[760px]:min-h-[400px] max-[760px]:px-[26px] max-[760px]:py-8 max-[420px]:min-h-[360px] max-[420px]:px-5 max-[420px]:py-[26px]">

    <a href="{% url 'home' %}" class="auth-brand relative z-[1] text-[30px] font-black tracking-[-1px] no-underline max-[760px]:text-[26px]">
        SiBekas
    </a>

    <div class="auth-intro-card relative my-auto w-full max-w-[660px] self-center px-[38px] py-[34px] max-[1000px]:p-7 max-[760px]:my-10 max-[760px]:max-w-[560px] max-[760px]:transform-none max-[420px]:my-8 max-[420px]:p-[23px]">

        <p class="auth-intro-eyebrow mb-5">
            {{ intro_eyebrow }}
        </p>

        <h1>
            {{ intro_heading|safe }}
        </h1>

        <p class="auth-intro-description">
            {{ intro_description }}
        </p>
    </div>

    <p class="auth-intro-footer relative z-[1] m-0">
        {{ intro_footer }}
    </p>

</section>
