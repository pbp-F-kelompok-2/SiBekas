<div class="edit-profile-overlay fixed inset-0 z-[9999] items-center justify-center overflow-y-auto p-6 max-[600px]:p-4{% if form.errors %} is-open{% endif %}"
     id="editProfileModal">

    <section class="edit-profile-modal relative my-auto max-h-[calc(100vh-48px)] w-full max-w-[560px] overflow-y-auto p-[28px_30px] max-[600px]:max-h-[calc(100dvh-32px)] max-[600px]:max-w-full max-[600px]:p-[24px_20px]"
             role="dialog"
             aria-modal="true"
             aria-labelledby="editProfileTitle">

        <header class="edit-profile-header mb-[22px] flex items-center justify-between gap-4">
            <h2 id="editProfileTitle">Ubah profil</h2>

            <button type="button"
                    class="edit-profile-close flex h-8 w-8 shrink-0 items-center justify-center"
                    id="closeEditProfile"
                    aria-label="Tutup modal">
                &times;
            </button>
        </header>

        <form method="POST"
              action="{% url 'profile:edit' %}"
              hx-post="{% url 'profile:edit' %}"
              hx-target="#editProfileModal"
              hx-swap="outerHTML"
              class="edit-profile-form flex flex-col gap-5 max-[600px]:gap-[17px]">

            {% csrf_token %}

            {% for field in form %}
                <div class="edit-profile-field flex min-w-0 flex-col gap-[9px]">
                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for error in field.errors %}
                        <p class="edit-profile-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}

            <button type="submit" class="edit-profile-submit">
                Simpan perubahan
            </button>
        </form>
    </section>
</div>
