<header class="site-header">
    <nav class="container nav" aria-label="Navigasi utama">

        <a
            class="brand"
            href="{% url 'home' %}"
        >
            <span class="brand-mark">
                SB
            </span>

            <span>
                SiBekas
            </span>
        </a>

        <button
            class="nav-toggle"
            type="button"
            id="nav-toggle"
            aria-label="Buka menu navigasi"
            aria-expanded="false"
            aria-controls="nav-menu"
        >
            <i
                data-lucide="menu"
                class="nav-toggle-icon"
            ></i>
        </button>

        <div
            class="nav-menu"
            id="nav-menu"
        >

            <div class="nav-links">

                <a href="{% url 'home' %}">
                    <i data-lucide="house"></i>
                    <span>Beranda</span>
                </a>

                <a href="{% url 'product:index' %}">
                    <i data-lucide="store"></i>
                    <span>Produk</span>
                </a>

                {% if user.is_authenticated %}

                    <a href="{% url 'cart:index' %}">
                        <i data-lucide="shopping-cart"></i>
                        <span>Keranjang</span>
                    </a>

                    <a href="{% url 'order:index' %}">
                        <i data-lucide="receipt-text"></i>
                        <span>Pesanan</span>
                    </a>

                    <a href="{% url 'review:index' %}">
                        <i data-lucide="message-square-text"></i>
                        <span>Ulasan</span>
                    </a>

                {% else %}
                    <a href="{% url 'profile:login' %}">
                        <i data-lucide="shopping-cart"></i>
                        <span>Keranjang</span>
                    </a>

                    <a href="{% url 'profile:login' %}">
                        <i data-lucide="receipt-text"></i>
                        <span>Pesanan</span>
                    </a>

                    <a href="{% url 'profile:login' %}">
                        <i data-lucide="message-square-text"></i>
                        <span>Ulasan</span>
                    </a>

                {% endif %}

            </div>

            <div class="nav-account">

                {% if user.is_authenticated %}

                    <a href="{% url 'profile:index' %}">
                        {{ user.username }}
                    </a>

                    <a
                        class="nav-account-link"
                        href="{% url 'profile:logout' %}"
                    >
                        <i data-lucide="user"></i>
                        Keluar
                    </a>

                {% else %}

                    <span class="nav-guest">
                        Guest
                    </span>

                    <a
                        class="nav-account-link"
                        href="{% url 'profile:login' %}"
                    >
                        <i data-lucide="log-in"></i>
                        Masuk
                    </a>

                {% endif %}

            </div>

        </div>
    </nav>
</header>
