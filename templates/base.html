{% load static %}
<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Marketplace barang preloved untuk mahasiswa UI.">
    <title>{% block title %}SiBekas{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
    <header class="site-header">
        <nav class="container nav" aria-label="Navigasi utama">
            <a class="brand" href="{% url 'home' %}">SiBekas</a>
            <div class="nav-links">
                <a href="{% url 'product:index' %}">Produk</a>
                <a href="{% url 'cart:index' %}">Keranjang</a>
                <a href="{% url 'order:index' %}">Pesanan</a>
                <a href="{% url 'review:index' %}">Ulasan</a>
                {% if user.is_authenticated %}
                    <a>{{ user.username }}</a>
                    <a href="{% url 'profile:logout' %}">Logout</a>
                {% else %}
                    <a href="{% url 'profile:login' %}">Login</a>
                    <a href="{% url 'profile:register' %}">Register</a>
                {% endif %}
            </div>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="container footer">SiBekas - barang lama, cerita baru.</footer>
</body>
</html>
