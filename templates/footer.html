<footer class="site-footer">

    <div class="container footer-content">

        <div class="footer-info">

            <a
                class="footer-brand"
                href="{% url 'home' %}"
            >
                <span class="brand-mark">
                    SB
                </span>

                <span>
                    SiBekas
                </span>
            </a>

            <p class="footer-copy">
                Marketplace barang preloved
                untuk mahasiswa UI.
            </p>

        </div>

        <nav
            class="footer-links"

            {% if user.is_authenticated %}

                <a href="{% url 'order:index' %}">

                </a>

                <a href="{% url 'review:index' %}">

                </a>

            {% else %}
                <a href="{% url 'profile:login' %}">
                    Keranjang
                </a>

                <a href="{% url 'profile:login' %}">
                    Pesanan
                </a>

                <a href="{% url 'profile:login' %}">
                    Ulasan
                </a>

                <a href="{% url 'profile:login' %}">
                    Profil Saya
                </a>

            {% endif %}
        </nav>

    </div>

    <div class="container footer-bottom">
