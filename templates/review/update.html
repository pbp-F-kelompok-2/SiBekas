{% extends "base.html" %}

{% block content %}

<p class="eyebrow">Review</p>

<h1>Edit Ulasan</h1>

<p class="hero-copy">
    Perbarui rating atau komentar yang sudah kamu berikan.
</p>

<section class="modules">
    <h2>{{ review.product.name }}</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="button">
            Simpan Perubahan
        </button>

        <a href="{% url 'review:index' %}" class="button">
            Batal
        </a>
    </form>
</section>

{% endblock %}
