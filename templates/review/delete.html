{% extends "base.html" %}

{% block content %}

<h1>Hapus Ulasan</h1>

<p>
    Apakah kamu yakin ingin menghapus ulasan untuk
    <strong>{{ review.product.name }}</strong>?
</p>

<p>Rating: {{ review.rating }}/5</p>
<p>{{ review.comment }}</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Ya, Hapus</button>
    <a href="{% url 'review:index' %}">Batal</a>
</form>

{% endblock %}
